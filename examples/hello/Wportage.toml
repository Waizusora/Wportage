[project]
name = "hello"
version = "0.1.0"
default_target = "hello"

[build]
out_dir = "target/wportage"

[target.prepare]
type = "exec"
program = "echo"
args = ["preparing example"]

[target.docs]
type = "exec"
program = "echo"
args = ["generating documentation"]

[target.hello]
type = "exec"
deps = ["prepare", "docs"]
program = "echo"
args = ["Hello from Wportage"]

[target.test]
type = "exec"
test = true
program = "echo"
args = ["example test passed"]
